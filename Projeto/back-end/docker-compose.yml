services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ellp_blocos
      POSTGRES_USER: ellp
      POSTGRES_PASSWORD: ellp
    ports:
      - "5432:5432"
    volumes:
      - ellp_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ellp -d ellp_blocos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ellp_postgres_data:
